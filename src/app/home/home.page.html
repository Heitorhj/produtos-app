<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Produtos
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    
    <h2>{{produto.nome}}</h2>

    <p>ID: {{produto.id}}</p>
    <p>Quantidade: {{produto.quantidade}}</p>
    <p>Preço: R$ {{produto.valor}}</p>
  </div>
</ion-content>
